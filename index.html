<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA // Tactical Ops</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <span class="brand">NEXORA</span>
  <span class="link" id="link">LINK: STANDBY</span>
  <time class="clock" id="clock">--:--:--</time>
</header>

<main class="grid">
  <section class="card map-card">
    <h2>Operational Map</h2>
    <div class="map" id="map">
      <div class="map-grid"></div>
      <span class="map-tag">SECTOR 7 / FEED 01</span>
    </div>
  </section>

  <section class="card">
    <h2>Squad</h2>
    <div id="squad"></div>
  </section>

  <section class="card comms-card">
  <h2>Comms</h2>
  <canvas id="radio-wave"></canvas>
  <div class="comms-row">
    <button id="radio-btn">HOLD TO TRANSMIT</button>
    <span id="radio-status" class="rx">RX</span>
  </div>
  <div class="comms-hint">or hold <kbd>V</kbd></div>
</section>


  <section class="card b2-card">
    <h2>B-2 Spirit</h2>
    <div id="b2-canvas"></div>
    <span class="b2-tag">DRAG TO ROTATE / SCROLL TO ZOOM</span>
  </section>

  <section class="card">
    <h2>Units</h2>
    <div class="units" id="units"></div>
  </section>

  <section class="card">
    <h2>Alerts</h2>
    <ul class="alerts" id="alerts"></ul>
  </section>

  <section class="card">
    <h2>Status</h2>
    <dl class="stats">
      <div><dt>Active units</dt><dd id="statUnits">0</dd></div>
      <div><dt>Threat</dt><dd id="statThreat">LOW</dd></div>
      <div><dt>Comms</dt><dd id="statComms">SECURE</dd></div>
    </dl>
  </section>
</main>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="script.js"></script>
<script src="radar.js"></script>
<script src="radar-trail.js"></script>
<script src="coords.js"></script>
<script src="patches.js"></script>
<script src="squad.js"></script>
<script src="key.js"></script>
<script src="radio.js"></script>
<script src="b2-mini.js"></script>
</body>
</html>
